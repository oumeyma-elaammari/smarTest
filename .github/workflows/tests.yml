name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/smartest-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Maven test
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/smartest-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/smartest-web/package-lock.json
      - run: npm ci
      - run: mkdir -p test-results
      - name: Vitest (CI + JUnit)
        env:
          CI: true
        run: npm run test:ci
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit
          path: packages/smartest-web/test-results/vitest-junit.xml

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/smartest-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet test
        run: dotnet test smartest-desktop.Tests/smartest-desktop.Tests.csproj -c Release
