spring:
  config:
    import: optional:classpath:application-local.yaml

  application:
    name: smarTest-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # Mot de passe : variable SPRING_DATASOURCE_PASSWORD ou fichier application-local.yaml (voir application-local.example.yaml)
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
