    secret: TestJwtSecretKeyForIntegrationTestsOnly_MustBeAtLeast256BitsLong_0123456789ABCDEF
    expiration: 86400000
  flyway:
    repair-before-migrate: false
  web:
    dashboard-url: http://localhost:5173/dashboard

groq:
